<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esticker – figurinhas esticadas</title>
<style>
:root{--bg1:#1a1030;--bg2:#2b1650;--card:#ffffff14;--tx:#f5f1ff;--mut:#b7a9d9;--ac:#c6ff3d;--ac2:#ff4fa3;--ln:#ffffff22;--onac:#1a1030;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#fff4fb;--bg2:#e9e2ff;--card:#ffffffc0;--tx:#241347;--mut:#6f5fa0;--ac:#6a2cf5;--ac2:#ff2f92;--ln:#2413471f;--onac:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg1:#fff4fb;--bg2:#e9e2ff;--card:#ffffffc0;--tx:#241347;--mut:#6f5fa0;--ac:#6a2cf5;--ac2:#ff2f92;--ln:#2413471f;--onac:#fff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px 8px}
header{display:flex;align-items:center;gap:8px;height:46px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;flex:1;white-space:nowrap}
.logo i{display:inline-block;font-style:normal;color:var(--ac2);animation:st 2.4s ease-in-out infinite;transform-origin:center}
@keyframes st{0%,100%{transform:scaleX(1)}50%{transform:scaleX(2.1)}}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:19px}
.go{height:42px;padding:0 16px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--ac2),#ff8a3d);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px #ff4fa355}
.wrap{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;position:relative}
.stage{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:26px;overflow:hidden;border:2px dashed var(--ln);background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/22px 22px;touch-action:none}
canvas{width:100%;height:100%;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:14px;text-align:center;pointer-events:none}
.empty b{font-size:54px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scaleX(1.25)}}
#msg{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;font-size:12px;padding:7px 12px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.panels{height:148px;margin-top:8px;position:relative}
.panel{position:absolute;inset:0;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:9px 12px;display:none;backdrop-filter:blur(8px)}
.panel.on{display:block}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--ln);background:#ffffff0d;color:var(--tx);font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:700}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:1px solid #8888}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:4px}
.sl label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
input[type=range]{width:100%;height:30px;margin:0;accent-color:var(--ac)}
input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:#0000002a;color:var(--tx);font-size:16px;margin-bottom:6px}
.lbl{font-size:11px;color:var(--mut);margin:5px 0 3px}
nav.tabs{display:flex;gap:6px;margin-top:8px;padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--ln)}
nav.tabs button{flex:1;padding:8px 0 6px;border:0;border-radius:16px;background:none;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button span{font-size:21px;line-height:1.1}
nav.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac)}
nav.tabs button.on{color:#fff}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">esti<i>↔</i>cker</div>
  <button class="ib" id="pick" aria-label="Galeria">🖼️</button>
  <button class="ib" id="save" aria-label="Salvar">💾</button>
  <button class="go" id="send">Enviar ▸</button>
</header>
<input type="file" id="file" accept="image/*" hidden>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" width="512" height="512"></canvas>
    <div class="empty" id="empty"><b>🫠</b>Toque aqui e escolha<br>uma imagem da galeria</div>
  </div>
  <div id="msg"></div>
</div>

<div class="panels">
  <section class="panel on" id="p1">
    <div class="row">
      <button class="chip" data-pre="1,1">Normal</button>
      <button class="chip" data-pre="2.4,.55">↔ Largo</button>
      <button class="chip" data-pre=".5,2.4">↕ Alto</button>
      <button class="chip" data-pre="3,.3">💥 Extremo</button>
      <button class="chip" data-pre=".4,.4">Espreme</button>
      <button class="chip" id="lock">🔗 Travar</button>
      <button class="chip" id="rst">↺ Zerar</button>
    </div>
    <div class="g2">
      <div class="sl"><label><span>↔ Horizontal</span><span id="vx"></span></label><input type="range" id="sx" min="20" max="400" value="100"></div>
      <div class="sl"><label><span>↕ Vertical</span><span id="vy"></span></label><input type="range" id="sy" min="20" max="400" value="100"></div>
      <div class="sl"><label><span>🔍 Zoom</span><span id="vz"></span></label><input type="range" id="zm" min="30" max="300" value="100"></div>
      <div class="sl"><label><span>⟳ Girar</span><span id="vr"></span></label><input type="range" id="rt" min="-180" max="180" value="0"></div>
    </div>
  </section>

  <section class="panel" id="p2">
    <div class="row" id="shapes">
      <button class="chip on" data-s="none">⬜ Livre</button>
      <button class="chip" data-s="round">▢ Arredondado</button>
      <button class="chip" data-s="circle">⚪ Círculo</button>
      <button class="chip" data-s="star">⭐ Estrela</button>
      <button class="chip" data-s="heart">❤️ Coração</button>
    </div>
    <div class="lbl">Contorno</div>
    <div class="row" id="outs">
      <button class="chip on" data-o="#ffffff"><i class="dot" style="background:#fff"></i>Branco</button>
      <button class="chip" data-o="#000000"><i class="dot" style="background:#000"></i>Preto</button>
      <button class="chip" data-o="#ffd400"><i class="dot" style="background:#ffd400"></i>Amarelo</button>
      <button class="chip" data-o="#ff4fa3"><i class="dot" style="background:#ff4fa3"></i>Rosa</button>
      <button class="chip" data-o="">∅ Nenhum</button>
      <button class="chip" id="shd">☁ Sombra</button>
    </div>
    <div class="sl"><label><span>Espessura</span></label><input type="range" id="ow" min="2" max="24" value="10"></div>
  </section>

  <section class="panel" id="p3">
    <input type="text" id="tx" placeholder="Legenda da figurinha" maxlength="40">
    <div class="row">
      <button class="chip on" data-tp="bottom">⬇ Embaixo</button>
      <button class="chip" data-tp="top">⬆ Em cima</button>
      <button class="chip" data-tp="center">⏺ Centro</button>
    </div>
    <div class="sl"><label><span>Tamanho</span></label><input type="range" id="ts" min="30" max="110" value="64"></div>
  </section>
</div>

<nav class="tabs">
  <button data-t="p1" class="on"><span>↔️</span>Esticar</button>
  <button data-t="p2"><span>✨</span>Estilo</button>
  <button data-t="p3"><span>💬</span>Texto</button>
</nav>
</div>
<script>
const S=512,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const st={img:null,sx:1,sy:1,zoom:1,rot:0,x:0,y:0,shape:'none',out:'#ffffff',ow:10,shadow:false,text:'',tpos:'bottom',tsize:64,lock:false};

function pathShape(g,k){
  const c=S/2;g.beginPath();
  if(k==='circle')g.arc(c,c,c-2,0,7);
  else if(k==='round')g.roundRect(2,2,S-4,S-4,110);
  else if(k==='star'){for(let i=0;i<10;i++){const r=i%2?c*.46:c-4,a=-Math.PI/2+i*Math.PI/5;g[i?'lineTo':'moveTo'](c+r*Math.cos(a),c+r*Math.sin(a))}g.closePath()}
  else if(k==='heart'){g.moveTo(c,S-8);g.bezierCurveTo(-60,c+40,40,10,c,c*.55);g.bezierCurveTo(S-40,10,S+60,c+40,c,S-8);g.closePath()}
}
function layer(){
  const L=document.createElement('canvas');L.width=L.height=S;const g=L.getContext('2d');
  if(st.img){
    const w=st.img.width,h=st.img.height,b=Math.min(S/w,S/h);
    g.translate(S/2+st.x,S/2+st.y);g.rotate(st.rot*Math.PI/180);g.scale(st.zoom*st.sx,st.zoom*st.sy);
    g.drawImage(st.img,-w*b/2,-h*b/2,w*b,h*b);g.setTransform(1,0,0,1,0,0);
  }
  if(st.shape!=='none'){g.globalCompositeOperation='destination-in';pathShape(g,st.shape);g.fill();g.globalCompositeOperation='source-over'}
  return L;
}
function render(){
  ctx.clearRect(0,0,S,S);
  $('empty').style.display=st.img?'none':'flex';
  if(!st.img)return;
  const L=layer(),k=st.out?.9:.97;
  ctx.save();ctx.translate(S/2,S/2);ctx.scale(k,k);ctx.translate(-S/2,-S/2);
  if(st.shadow){ctx.shadowColor='#0008';ctx.shadowBlur=14;ctx.shadowOffsetY=6}
  if(st.out){
    const sil=document.createElement('canvas');sil.width=sil.height=S;const s=sil.getContext('2d');
    s.drawImage(L,0,0);s.globalCompositeOperation='source-in';s.fillStyle=st.out;s.fillRect(0,0,S,S);
    for(let a=0;a<32;a++){const t=a/32*Math.PI*2;ctx.drawImage(sil,Math.cos(t)*st.ow,Math.sin(t)*st.ow)}
    ctx.shadowColor='transparent';
  }
  ctx.drawImage(L,0,0);ctx.restore();
  if(st.text){
    ctx.font=`900 ${st.tsize}px Impact,"Arial Black",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineWidth=st.tsize/5;ctx.strokeStyle='#000';ctx.fillStyle='#fff';
    const y=st.tpos==='top'?st.tsize*.8:st.tpos==='center'?S/2:S-st.tsize*.8;
    let t=st.text.toUpperCase(),sc=Math.min(1,(S-30)/ctx.measureText(t).width);
    ctx.save();ctx.translate(S/2,y);ctx.scale(sc,sc);ctx.strokeText(t,0,0);ctx.fillText(t,0,0);ctx.restore();
  }
}
function sync(){
  $('sx').value=st.sx*100;$('sy').value=st.sy*100;$('zm').value=st.zoom*100;$('rt').value=st.rot;
  $('vx').textContent=Math.round(st.sx*100)+'%';$('vy').textContent=Math.round(st.sy*100)+'%';
  $('vz').textContent=Math.round(st.zoom*100)+'%';$('vr').textContent=Math.round(st.rot)+'°';render();
}
// carregar imagem
function load(f){
  if(!f)return;const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{st.img=im;Object.assign(st,{sx:1,sy:1,zoom:1,rot:0,x:0,y:0});sync();msg('')};
  im.src=u;
}
$('file').onchange=e=>load(e.target.files[0]);
$('pick').onclick=()=>$('file').click();
$('stage').addEventListener('click',()=>{if(!st.img)$('file').click()});
// sliders
$('sx').oninput=e=>{const v=e.target.value/100;if(st.lock){st.sy=v}st.sx=v;sync()};
$('sy').oninput=e=>{const v=e.target.value/100;if(st.lock){st.sx=v}st.sy=v;sync()};
$('zm').oninput=e=>{st.zoom=e.target.value/100;sync()};
$('rt').oninput=e=>{st.rot=+e.target.value;sync()};
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.pre.split(',');st.sx=+a;st.sy=+c;sync()});
$('lock').onclick=e=>{st.lock=!st.lock;e.target.classList.toggle('on',st.lock)};
$('rst').onclick=()=>{Object.assign(st,{sx:1,sy:1,zoom:1,rot:0,x:0,y:0});sync()};
// estilo
function group(sel,attr,fn){document.querySelectorAll(sel+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll(sel+' .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset[attr]);render()})}
group('#shapes','s',v=>st.shape=v);
group('#outs','o',v=>st.out=v);
$('ow').oninput=e=>{st.ow=+e.target.value;render()};
$('shd').onclick=e=>{st.shadow=!st.shadow;e.target.classList.toggle('on',st.shadow);render()};
// texto
$('tx').oninput=e=>{st.text=e.target.value;render()};
$('ts').oninput=e=>{st.tsize=+e.target.value;render()};
group('#p3','tp',v=>st.tpos=v);
// abas
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on')});
// arrastar
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!st.img)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const k=S/cv.getBoundingClientRect().width;st.x=drag.ox+(e.clientX-drag.x)*k;st.y=drag.oy+(e.clientY-drag.y)*k;render()});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=null));
// exportar WebP 512x512 (limite do WhatsApp: 100 KB)
let mt;function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=t?1:0;clearTimeout(mt);mt=setTimeout(()=>m.style.opacity=0,3500)}
async function exportBlob(){
  if(!st.img){msg('Escolha uma imagem primeiro.');return null}
  render();
  for(let q=.95;q>=.3;q-=.1){
    const b=await new Promise(r=>cv.toBlob(r,'image/webp',q));
    if(b&&b.size<=100*1024)return b;
  }
  return await new Promise(r=>cv.toBlob(r,'image/webp',.3));
}
const CP=window.Capacitor&&window.Capacitor.Plugins;
const toB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const nome=()=>'figurinha-'+Date.now()+'.webp';
function webSave(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome();a.click()}
$('save').onclick=async()=>{
  const b=await exportBlob();if(!b)return;
  if(CP&&CP.Filesystem){
    try{await CP.Filesystem.writeFile({path:'Esticker/'+nome(),data:await toB64(b),directory:'DOCUMENTS',recursive:true});msg('Salva em Documentos/Esticker ('+Math.round(b.size/1024)+' KB)');return}catch(e){}
  }
  webSave(b);msg('Salva ('+Math.round(b.size/1024)+' KB).');
};
$('send').onclick=async()=>{
  const b=await exportBlob();if(!b)return;
  if(CP&&CP.Filesystem&&CP.Share){
    try{const w=await CP.Filesystem.writeFile({path:nome(),data:await toB64(b),directory:'CACHE'});await CP.Share.share({files:[w.uri],dialogTitle:'Enviar figurinha'});return}catch(e){msg('Não consegui abrir o compartilhamento.');return}
  }
  const f=new File([b],'figurinha.webp',{type:'image/webp'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{webSave(b);msg('Arquivo salvo. Envie pelo WhatsApp.')}
};
sync();
</script>
</body>
</html>
